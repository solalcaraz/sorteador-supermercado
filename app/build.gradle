plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.flatlaf

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

application {
    mainClass = 'logica.App'
    // FlatLaf carga una librería nativa para integrarse con la ventana de Windows;
    // desde Java 24 eso muestra un aviso si no se habilita explícitamente.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('test') {
    useJUnitPlatform()
}
